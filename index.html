<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaktFly - Logistique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body class="bg-slate-50">

    <!-- 1. ECRAN DE CONNEXION (NUMÉRO UNIQUEMENT) -->
    <div id="view-login" class="view active min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md text-center space-y-8">
            <h1 class="text-4xl font-black tracking-tighter">Wakt<span class="text-emerald-500">Fly</span></h1>
            <div class="bg-white p-8 rounded-[40px] shadow-xl space-y-6">
                <p class="font-bold text-slate-700">Entrez votre numéro Bankily / Masrvi</p>
                <input id="login-phone" type="tel" placeholder="Ex: 44112233" class="w-full p-5 bg-slate-100 rounded-2xl border-none text-center text-2xl font-bold">
                <button onclick="checkAccess()" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-bold text-lg">Accéder à mes colis</button>
            </div>
        </div>
    </div>

    <!-- 2. ECRAN DE PAIEMENT (SI PAS ACTIF) -->
    <div id="view-payment" class="view min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md text-center space-y-6">
            <div class="bg-white p-8 rounded-[40px] shadow-xl border-2 border-orange-500">
                <div class="w-20 h-20 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i data-lucide="lock" class="w-10 h-10"></i>
                </div>
                <h2 class="text-2xl font-black mb-2">Accès restreint</h2>
                <p class="text-slate-500 text-sm mb-6">Votre abonnement est expiré ou non payé.</p>
                
                <div class="bg-slate-50 p-6 rounded-3xl text-left space-y-4 mb-6">
                    <p class="text-xs font-bold uppercase text-slate-400 tracking-widest">Instructions de paiement</p>
                    <div class="flex justify-between items-center">
                        <span class="font-bold">Bankily / Masrvi</span>
                        <span class="text-emerald-600 font-black">44 00 00 00</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-bold">Montant</span>
                        <span class="font-black">500 MRU / mois</span>
                    </div>
                </div>
                
                <p class="text-[10px] text-slate-400 italic">Une fois le transfert effectué, votre compte sera activé dans les 10 minutes.</p>
                <button onclick="location.reload()" class="w-full mt-6 bg-slate-100 p-4 rounded-2xl font-bold">J'ai déjà payé</button>
            </div>
        </div>
    </div>

    <!-- 3. DASHBOARD (SI ACTIF) -->
    <div id="view-app" class="view pb-24">
        <header class="bg-slate-900 text-white p-8 rounded-b-[40px] flex justify-between items-center">
            <div>
                <h2 class="text-xl font-black">WaktFly</h2>
                <p id="display-phone" class="text-xs text-slate-400"></p>
            </div>
            <button onclick="location.reload()" class="bg-white/10 p-3 rounded-2xl"><i data-lucide="log-out" class="w-5 h-5"></i></button>
        </header>
        <main class="p-6 space-y-6">
            <div class="flex justify-between items-center">
                <h3 class="font-black text-lg">Mes Livraisons</h3>
                <button onclick="addParcel()" class="bg-emerald-500 text-white px-6 py-3 rounded-full font-bold shadow-lg">+ Nouveau</button>
            </div>
            <div id="parcel-list" class="space-y-4"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://nmdartirynitkdgpwmra.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ykVebBXbVYSMHD_hDrsmzQ_JNjqBy5U';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentPhone = "";

        async function checkAccess() {
            const phone = document.getElementById('login-phone').value;
            if (!phone) return alert("Entrez votre numéro");

            // Vérifier si le marchand existe et est actif
            const { data, error } = await supabase
                .from('authorized_merchants')
                .select('*')
                .eq('phone', phone)
                .single();

            if (data && data.is_active) {
                currentPhone = phone;
                showView('app');
                loadParcels();
            } else {
                // Si n'existe pas, on le crée en mode "non-actif" pour ton suivi
                if (!data) {
                    await supabase.from('authorized_merchants').insert([{ phone: phone, is_active: false }]);
                }
                showView('payment');
            }
        }

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            lucide.createIcons();
        }

        async function loadParcels() {
            document.getElementById('display-phone').innerText = "Marchand: " + currentPhone;
            const { data } = await supabase.from('parcels').select('*').eq('merchant_phone', currentPhone);
            
            const list = document.getElementById('parcel-list');
            list.innerHTML = data.map(p => `
                <div class="bg-white p-5 rounded-[30px] shadow-sm border border-slate-100 flex justify-between items-center">
                    <div>
                        <p class="font-bold">${p.customer_name}</p>
                        <p class="text-[10px] text-slate-400 uppercase font-black">${p.status}</p>
                    </div>
                    <p class="font-black">${p.total_to_pay} MRU</p>
                </div>
            `).join('');
            if(data.length === 0) list.innerHTML = "<p class='text-center text-slate-400 py-10'>Aucun colis.</p>";
        }

        async function addParcel() {
            const name = prompt("Nom du client ?");
            const price = prompt("Prix du produit (MRU) ?");
            if(!name || !price) return;

            await supabase.from('parcels').insert([{
                customer_name: name,
                total_to_pay: parseInt(price) + 200,
                merchant_phone: currentPhone,
                status: 'en_attente',
                short_id: 'WF-' + Math.floor(1000 + Math.random() * 9000)
            }]);
            loadParcels();
        }

        lucide.createIcons();
    </script>
</body>
</html>
