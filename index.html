<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaktFly - Test</title>
    <!-- Chargement des bibliothèques via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased">

    <!-- 1. ECRAN DE CONNEXION -->
    <div id="view-login" class="view active min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md text-center space-y-8">
            <h1 class="text-4xl font-black text-slate-900">Wakt<span class="text-emerald-500">Fly</span></h1>
            <div class="bg-white p-8 rounded-[30px] shadow-xl space-y-6">
                <p class="font-bold text-slate-700">Entrez votre numéro Bankily</p>
                <input id="login-phone" type="tel" placeholder="Ex: 44112233" class="w-full p-4 bg-slate-100 rounded-2xl border-none text-center text-2xl font-bold">
                <button onclick="checkAccess()" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold text-lg">Accéder</button>
            </div>
        </div>
    </div>

    <!-- 2. ECRAN DE PAIEMENT -->
    <div id="view-payment" class="view min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md text-center space-y-6">
            <div class="bg-white p-8 rounded-[30px] shadow-xl border-2 border-orange-500">
                <h2 class="text-2xl font-black mb-4">Accès restreint</h2>
                <p class="text-slate-500 mb-6">Payez 500 MRU au Bankily : <br><span class="text-slate-900 font-black text-xl">44 00 00 00</span></p>
                <button onclick="window.location.reload()" class="w-full bg-slate-100 p-4 rounded-2xl font-bold">J'ai déjà payé</button>
            </div>
        </div>
    </div>

    <!-- 3. DASHBOARD -->
    <div id="view-app" class="view">
        <header class="bg-slate-900 text-white p-6 flex justify-between items-center">
            <div>
                <h2 class="font-black">WaktFly</h2>
                <p id="display-phone" class="text-[10px] text-slate-400"></p>
            </div>
            <button onclick="window.location.reload()" class="text-slate-400">Quitter</button>
        </header>
        <main class="p-6 space-y-6">
            <div class="flex justify-between items-center">
                <h3 class="font-black">Mes Colis</h3>
                <button onclick="addParcel()" class="bg-emerald-500 text-white px-4 py-2 rounded-full font-bold text-sm">+ Nouveau</button>
            </div>
            <div id="parcel-list" class="space-y-4"></div>
        </main>
    </div>

    <script>
        // CONFIGURATION
        const SUPABASE_URL = 'https://nmdartirynitkdgpwmra.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ykVebBXbVYSMHD_hDrsmzQ_JNjqBy5U';
        
        // Initialisation sécurisée
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentPhone = "";

        async function checkAccess() {
            const phone = document.getElementById('login-phone').value.trim();
            if (!phone) { alert("Entrez un numéro"); return; }

            try {
                const { data, error } = await supabaseClient
                    .from('authorized_merchants')
                    .select('*')
                    .eq('phone', phone);

                if (error) throw error;

                if (data && data.length > 0 && data[0].is_active) {
                    currentPhone = phone;
                    showView('app');
                    loadParcels();
                } else {
                    if (!data || data.length === 0) {
                        await supabaseClient.from('authorized_merchants').insert([{ phone: phone, is_active: false }]);
                    }
                    showView('payment');
                }
            } catch (e) {
                alert("Erreur : " + e.message);
            }
        }

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            if(window.lucide) window.lucide.createIcons();
        }

        async function loadParcels() {
            document.getElementById('display-phone').innerText = currentPhone;
            const { data, error } = await supabaseClient
                .from('parcels')
                .select('*')
                .eq('merchant_phone', currentPhone);
            
            const list = document.getElementById('parcel-list');
            if (data && data.length > 0) {
                list.innerHTML = data.map(p => `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                        <div><p class="font-bold">${p.customer_name}</p><p class="text-[10px] uppercase text-slate-400">${p.status}</p></div>
                        <p class="font-black">${p.total_to_pay} MRU</p>
                    </div>
                `).join('');
            } else {
                list.innerHTML = "<p class='text-center text-slate-400 py-10'>Aucun colis.</p>";
            }
        }

        async function addParcel() {
            const name = prompt("Nom du client ?");
            const price = prompt("Prix ?");
            if (!name || !price) return;

            await supabaseClient.from('parcels').insert([{
                customer_name: name,
                total_to_pay: parseInt(price) + 200,
                merchant_phone: currentPhone,
                status: 'en_attente',
                short_id: 'WF-' + Math.floor(Math.random() * 9000)
            }]);
            loadParcels();
        }

        // Au démarrage
        window.onload = () => { if(window.lucide) window.lucide.createIcons(); };
    </script>
</body>
</html>
