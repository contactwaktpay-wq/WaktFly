<script>
    const SUPABASE_URL = 'https://nmdartirynitkdgpwmra.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ykVebBXbVYSMHD_hDrsmzQ_JNjqBy5U';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPhone = "";

    async function checkAccess() {
        const phoneInput = document.getElementById('login-phone');
        const phone = phoneInput.value.trim();
        
        if (!phone) {
            alert("Veuillez entrer un numéro");
            return;
        }

        console.log("Vérification du numéro :", phone);

        try {
            // 1. Chercher le marchand
            const { data, error } = await supabase
                .from('authorized_merchants')
                .select('*')
                .eq('phone', phone);

            if (error) throw error;

            if (data && data.length > 0) {
                const merchant = data[0];
                if (merchant.is_active) {
                    currentPhone = phone;
                    showView('app');
                    loadParcels();
                } else {
                    showView('payment');
                }
            } else {
                // 2. Si le marchand n'existe pas, on le crée
                console.log("Nouveau marchand, création...");
                const { error: insertError } = await supabase
                    .from('authorized_merchants')
                    .insert([{ phone: phone, is_active: false }]);
                
                if (insertError) throw insertError;
                showView('payment');
            }
        } catch (err) {
            console.error(err);
            alert("Erreur de connexion : " + err.message);
        }
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
        lucide.createIcons();
    }

    async function loadParcels() {
        document.getElementById('display-phone').innerText = "Marchand: " + currentPhone;
        const { data, error } = await supabase
            .from('parcels')
            .select('*')
            .eq('merchant_phone', currentPhone);
        
        if (error) {
            alert("Erreur chargement colis : " + error.message);
            return;
        }

        const list = document.getElementById('parcel-list');
        if (data.length === 0) {
            list.innerHTML = "<p class='text-center text-slate-400 py-10 font-bold'>Aucun colis enregistré.<br>Cliquez sur Nouveau.</p>";
        } else {
            list.innerHTML = data.map(p => `
                <div class="bg-white p-5 rounded-[30px] shadow-sm border border-slate-100 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-slate-900">${p.customer_name}</p>
                        <p class="text-[10px] text-slate-400 uppercase font-black tracking-widest">${p.status}</p>
                    </div>
                    <p class="font-black text-slate-900">${p.total_to_pay} MRU</p>
                </div>
            `).join('');
        }
        lucide.createIcons();
    }

    async function addParcel() {
        const name = prompt("Nom du client ?");
        const price = prompt("Prix du produit (MRU) ?");
        if (!name || !price) return;

        const { error } = await supabase.from('parcels').insert([{
            customer_name: name,
            total_to_pay: parseInt(price) + 200,
            merchant_phone: currentPhone,
            status: 'en_attente',
            short_id: 'WF-' + Math.floor(1000 + Math.random() * 9000)
        }]);

        if (error) {
            alert("Erreur ajout : " + error.message);
        } else {
            loadParcels();
        }
    }

    // Initialisation des icônes au chargement
    window.onload = () => { lucide.createIcons(); };
</script>
