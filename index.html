<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaktFly - Gestion Directe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .card { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white p-8 rounded-b-[40px] shadow-2xl mb-8">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black tracking-tighter">Wakt<span class="text-emerald-400">Fly</span></h1>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">Gestion Logistique</p>
            </div>
            <div class="bg-emerald-500/20 p-3 rounded-2xl">
                <i data-lucide="database" class="text-emerald-400 w-6 h-6"></i>
            </div>
        </div>
    </header>

    <main class="px-6 space-y-8">
        <!-- STATS RAPIDES -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-[30px] shadow-sm border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase">Total Colis</p>
                <p id="count-total" class="text-2xl font-black">0</p>
            </div>
            <div class="bg-white p-5 rounded-[30px] shadow-sm border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase">Livrés</p>
                <p id="count-delivered" class="text-2xl font-black text-emerald-500">0</p>
            </div>
        </div>

        <!-- ACTIONS -->
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-black text-slate-800">Livraisons</h2>
            <button onclick="openModal()" class="bg-slate-900 text-white px-6 py-3 rounded-full font-bold shadow-lg flex items-center gap-2 active:scale-95 transition">
                <i data-lucide="plus" class="w-5 h-5"></i> Nouveau
            </button>
        </div>

        <!-- LISTE -->
        <div id="parcel-list" class="space-y-4">
            <div class="text-center py-20 text-slate-400">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full mb-4"></div>
                <p>Connexion à Supabase...</p>
            </div>
        </div>
    </main>

    <!-- MODAL AJOUT -->
    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[40px] p-8 space-y-4 shadow-2xl card">
            <h3 class="text-2xl font-black mb-2">Nouveau Colis</h3>
            <input id="in-name" type="text" placeholder="Nom du client" class="w-full p-4 bg-slate-100 rounded-2xl border-none font-bold">
            <div class="grid grid-cols-2 gap-2">
                <input id="in-zone" type="text" placeholder="Zone (ex: Ksar)" class="p-4 bg-slate-100 rounded-2xl border-none font-bold">
                <input id="in-price" type="number" placeholder="Prix (MRU)" class="p-4 bg-slate-100 rounded-2xl border-none font-bold">
            </div>
            <input id="in-landmark" type="text" placeholder="Point de repère" class="w-full p-4 bg-slate-100 rounded-2xl border-none font-bold">
            <div class="flex gap-3 pt-4">
                <button onclick="closeModal()" class="flex-1 p-4 font-bold text-slate-400">Annuler</button>
                <button onclick="createParcel()" class="flex-1 p-4 bg-emerald-500 text-white rounded-2xl font-bold shadow-lg shadow-emerald-200">Enregistrer</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION DIRECTE
        const SUPABASE_URL = 'https://nmdartirynitkdgpwmra.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ykVebBXbVYSMHD_hDrsmzQ_JNjqBy5U';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // CHARGEMENT DES DONNÉES
        async function loadData() {
            const { data, error } = await supabaseClient
                .from('parcels')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                alert("Erreur Supabase : " + error.message);
                return;
            }

            const list = document.getElementById('parcel-list');
            const totalEl = document.getElementById('count-total');
            const deliveredEl = document.getElementById('count-delivered');

            totalEl.innerText = data.length;
            deliveredEl.innerText = data.filter(p => p.status === 'livre').length;

            if (data.length === 0) {
                list.innerHTML = `<div class="text-center py-20 bg-white rounded-[40px] border-2 border-dashed border-slate-200">
                    <p class="text-slate-400 font-bold">Aucun colis en base.<br>Commencez par en ajouter un !</p>
                </div>`;
            } else {
                list.innerHTML = data.map(p => `
                    <div class="card bg-white p-6 rounded-[35px] shadow-sm border border-slate-100 flex justify-between items-center">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-black bg-slate-100 px-2 py-0.5 rounded-md text-slate-500">${p.short_id}</span>
                                <span class="text-[10px] font-black uppercase ${p.status === 'livre' ? 'text-emerald-500' : 'text-blue-500'}">${p.status}</span>
                            </div>
                            <p class="font-bold text-slate-900">${p.customer_name}</p>
                            <p class="text-xs text-slate-400">${p.zone} • <span class="italic">${p.landmark || ''}</span></p>
                        </div>
                        <div class="text-right space-y-2">
                            <p class="font-black text-lg text-slate-900">${p.total_to_pay} <span class="text-[10px]">MRU</span></p>
                            ${p.status !== 'livre' ? `
                                <button onclick="markDelivered(${p.id})" class="bg-emerald-500 text-white text-[10px] font-black px-3 py-2 rounded-xl shadow-md active:scale-90 transition">LIVRER</button>
                            ` : `<i data-lucide="check-circle" class="text-emerald-500 w-6 h-6 ml-auto"></i>`}
                        </div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        // ACTIONS
        async function createParcel() {
            const name = document.getElementById('in-name').value;
            const zone = document.getElementById('in-zone').value;
            const price = document.getElementById('in-price').value;
            const landmark = document.getElementById('in-landmark').value;

            if(!name || !price) return alert("Nom et Prix obligatoires");

            const { error } = await supabaseClient.from('parcels').insert([{
                short_id: 'WF-' + Math.floor(1000 + Math.random() * 9000),
                customer_name: name,
                zone: zone,
                landmark: landmark,
                product_price: parseFloat(price),
                delivery_fee: 200,
                total_to_pay: parseFloat(price) + 200,
                status: 'en_attente'
            }]);

            if (error) alert(error.message);
            else {
                closeModal();
                loadData();
            }
        }

        async function markDelivered(id) {
            const { error } = await supabaseClient.from('parcels').update({ status: 'livre' }).eq('id', id);
            if (error) alert(error.message);
            else loadData();
        }

        // UI
        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        window.onload = () => {
            loadData();
            lucide.createIcons();
        };
    </script>
</body>
</html>
